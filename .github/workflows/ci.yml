name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Archivos sin formatear:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

  # Recordatorio: NO se corren migraciones contra Supabase desde CI en esta etapa.
  # Las migraciones se aplican manualmente vía el MCP, con confirmación humana
  # (ver .claude/mcp-notes.md).
