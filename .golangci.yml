# Configuración de golangci-lint (esquema v2 — requerido para Go 1.27).
# Docs: https://golangci-lint.run/  ·  migración v1→v2: `golangci-lint migrate`
version: "2"

run:
  timeout: 3m

linters:
  enable:
    - bodyclose        # cerrar response bodies (pasarela de pagos, JWKS)
    - contextcheck     # propagar context.Context
    - errorlint        # errores envueltos con %w
    - gosec            # chequeos básicos de seguridad
    - revive
    - unconvert
    - whitespace
  # errcheck, govet, ineffassign, staticcheck, unused ya vienen en el set por defecto de v2.
  # misspell se omite a propósito: el código tiene comentarios en español (ver CLAUDE.md §5)
  # y da falsos positivos constantes ("dependencias", "solicitud", ...).
  settings:
    revive:
      rules:
        - name: exported
          disabled: true   # comentarios en español; no forzar el godoc en inglés
  exclusions:
    rules:
      # El skeleton tiene funciones sin cuerpo real todavía.
      - path: internal/platform/(database|auth)/
        linters:
          - unused
          - revive

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
